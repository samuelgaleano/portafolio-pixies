<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <title>Avatar pixel-art de Samuel: silueta con pelo crespo y gafas</title>
  <style>
    .px-eye { animation: px-blink 5s ease-in-out infinite; }
    @keyframes px-blink {
      0%, 92%, 100% { opacity: 1; }
      95%, 97% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .px-eye { animation: none; }
    }
  </style>

  <rect width="144" height="144" fill="#ece4fb" />
  <circle cx="72" cy="60" r="64" fill="#6d4aff" opacity="0.1" />

  <!-- silueta en bloques de 8px: pelo crespo (perfil escalonado) + bustos, un mismo tono -->
  <g fill="#1c1533">
    <rect x="48" y="16" width="16" height="8" />
    <rect x="72" y="16" width="16" height="8" />
    <rect x="40" y="24" width="64" height="8" />
    <rect x="32" y="32" width="80" height="8" />
    <rect x="24" y="40" width="88" height="8" />
    <rect x="24" y="48" width="88" height="8" />
    <rect x="24" y="56" width="88" height="8" />
    <rect x="32" y="64" width="80" height="8" />
    <rect x="32" y="72" width="80" height="8" />
    <rect x="32" y="80" width="80" height="8" />
    <rect x="40" y="88" width="64" height="8" />
    <rect x="48" y="96" width="48" height="8" />
    <rect x="48" y="104" width="48" height="8" />
    <rect x="16" y="112" width="112" height="8" />
    <rect x="8" y="120" width="128" height="8" />
    <rect x="0" y="128" width="144" height="8" />
    <rect x="0" y="136" width="144" height="8" />
  </g>

  <!-- gafas en bloques: dos lentes + puente, mismo lenguaje de píxeles que el logo -->
  <g fill="#6d4aff">
    <rect x="40" y="64" width="24" height="16" />
    <rect x="80" y="64" width="24" height="16" />
    <rect x="64" y="64" width="16" height="8" />
  </g>
  <!-- brillo de lente: un solo píxel claro por cara -->
  <g fill="#ece4fb" opacity="0.5">
    <rect x="40" y="64" width="8" height="8" />
    <rect x="80" y="64" width="8" height="8" />
  </g>
  <!-- ojos: parpadean cada tanto (se funden con la lente violeta al "cerrarse") -->
  <g fill="#ece4fb">
    <rect class="px-eye" x="48" y="72" width="8" height="8" />
    <rect class="px-eye" x="88" y="72" width="8" height="8" />
  </g>

  <!-- acento de marca: un píxel rojo, eco del logo -->
  <rect x="64" y="112" width="8" height="8" fill="#e8395c" />
</svg>
